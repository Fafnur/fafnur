name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  checks:
    name: Lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Corepack must be enabled before setup-node so that its Yarn cache uses Yarn 4 from `packageManager`.
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable

      # Base/head SHAs for `nx affected`: on main, the last commit with a successful CI run.
      - uses: nrwl/nx-set-shas@v5

      - name: Restore Nx cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium

      - name: Affected checks
        if: github.event_name == 'pull_request'
        run: yarn nx affected -t lint test build e2e

      # The sitemap's lastmod is the deploy date, so it is generated right before the production build.
      - name: Generate sitemap
        if: github.event_name == 'push'
        run: node --require @swc-node/register tools/scripts/sitemap.ts

      - name: All checks
        if: github.event_name == 'push'
        run: yarn nx run-many -t lint test build e2e

      - name: Upload site
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/apps/fafnur/browser
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 7

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@9.0.2
        with:
          switches: -avz --delete
          path: site/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      # CalVer tag of the deployed commit: vYYYY.MM.DD.N, N counts deploys of the day from 0.
      - name: Tag deploy
        run: |
          prefix="v$(date -u +%Y.%m.%d)"
          tag="$prefix.$(git tag --list "$prefix.*" | wc -l | tr -d ' ')"
          git tag "$tag"
          git push origin "$tag"
